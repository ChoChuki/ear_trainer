<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ear Trainer">
    <title>Ear Trainer</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <aside id="dailyGoalNotice" class="daily-goal-notice" hidden>
        <strong id="dailyGoalText" role="alert"></strong>
        <button type="button" class="secondary" id="dailyGoalDismiss">OK</button>
    </aside>
    <main class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <label class="header-picker" for="instrumentSelect">
                    <span id="instrumentLabel">Instrument</span>
                    <select id="instrumentSelect">
                        <option value="violin" selected>Violin</option>
                        <option value="piano">Piano</option>
                    </select>
                </label>
                <h1 id="appTitle">Ear Trainer <small id="appVersion"></small></h1>
                <label class="header-picker language-picker" for="languageSelect">
                    <span id="languageLabel">Language</span>
                    <select id="languageSelect" aria-label="Language">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="ja">&#26085;&#26412;&#35486;</option>
                        <option value="it">Italiano</option>
                        <option value="el">&#917;&#955;&#955;&#951;&#957;&#953;&#954;&#940;</option>
                        <option value="zh-TW">&#32321;&#39636;&#20013;&#25991;</option>
                    </select>
                </label>
            </div>
            <button id="updateButton" type="button" class="secondary update-button" hidden>Update to the new version</button>
            <button id="audioReload" type="button" class="secondary" hidden>Reload audio</button>
            <p id="status" class="status" aria-live="polite"></p>
        </header>

        <p id="storageWarning" role="alert" hidden></p>
        <section class="settings-card" id="settingsCard">
            <div class="settings-grid">
                <label><span data-i="mode"></span><select id="modeSelect"><option value="single" data-i="one"></option><option value="interval" data-i="two"></option><option value="free" data-i="free"></option></select></label>
                <label id="displayRow"><span data-i="answerWith"></span><select id="displaySelect"><option value="buttons" data-i="buttons"></option><option value="instrument" data-i="instrument"></option></select></label>
                <label class="wide"><span data-i="sound"></span><select id="soundSelect" aria-describedby="soundHint"><option value="piano" data-i="piano"></option><option value="violin" data-i="violin"></option><option value="mixed" data-i="mixed"></option></select></label>
            </div>
            <p id="soundHint" class="mini" data-i="mixedHint" hidden></p>
            <div id="apSettings">
                <fieldset><legend data-i="learningNotes"></legend><div id="learningNotes" class="note-grid"></div><p id="otherHint" class="mini" data-i="otherHint" hidden></p></fieldset>
                <fieldset><legend data-i="octaves"></legend><div id="octaves" class="octave-grid"></div></fieldset>
                <fieldset class="selection-preview"><legend data-i="previewSelected"></legend><div id="selectionPreviewKeys" class="preview-grid" aria-label="Preview" aria-describedby="selectionPreviewLabel"></div><p id="selectionPreviewLabel" class="mini" role="status" aria-live="polite"></p></fieldset>
                <label class="option-row"><input type="checkbox" id="blindCheck"><span data-i="blind"></span></label>
            </div>
            <div id="rpSettings" hidden>
                <div class="settings-grid">
                    <label><span data-i="minInterval"></span><select id="minIntervalSelect"></select></label>
                    <label><span data-i="maxInterval"></span><select id="maxIntervalSelect"></select></label>
                    <label class="wide"><span data-i="direction"></span><select id="directionSelect"><option value="both" data-i="random"></option><option value="higher" data-i="up"></option><option value="lower" data-i="down"></option></select></label>
                </div>
                <details id="rangeDetails"><summary><span data-i="pitchRange"></span> · <span id="rangeLabel"></span></summary>
                    <div class="settings-grid"><label><span data-i="from"></span><select id="startNote"></select></label><label><span data-i="to"></span><select id="endNote"></select></label></div>
                </details>
            </div>
            <div id="commonSettings">
                <label class="time-setting"><span data-i="answerTime"></span><input id="answerLimitSelect" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Answer time (seconds)"></label>
                <details><summary data-i="advanced"></summary>
                    <label class="option-row"><input type="checkbox" id="autoNextCheck" checked><span data-i="autoNext"></span></label>
                    <label class="option-row" id="maskRow"><input type="checkbox" id="maskCheck" checked><span data-i="mask"></span></label>
                    <p class="mini" data-i="timeHint"></p>
                </details>
            </div>
            <p id="configError" role="alert" hidden></p>
        </section>
        <div id="practicePanel">
            <section id="controls" class="controls unified-controls">
                <button id="playButton" class="primary" disabled data-i="start"></button>
                <button id="nextButton" class="secondary" hidden data-i="next"></button>
                <button id="replayButton" class="secondary" hidden data-i="replay"></button>
            </section>
            <section id="answerCard" class="answer-card" hidden>
                <div id="sessionScore" class="session-score"></div>
                <div id="answerText" role="status" aria-live="polite"></div>
                <div id="answerTimer" class="answer-timer" aria-hidden="true" hidden><span></span></div>
            </section>
            <div id="answerArea" hidden>
                <div id="extraAnswers" class="extra-answers" hidden><button id="otherButton" type="button" class="secondary other-answer" data-i="other"></button><button id="unsureButton" class="secondary" data-i="unsure"></button><button id="relativeButton" class="secondary" data-i="relative" hidden></button></div>
                <section id="buttonBoard" class="button-board" hidden>
                    <div id="apNameKeys" class="note-grid" role="group" aria-label="Note name"></div>
                    <div id="apOctaveKeys" class="octave-grid" role="group" aria-label="Octave"></div>
                    <div id="intervalAnswers" class="interval-answers" role="group" aria-label="Semitones"></div>
                    <p id="previewLabel" class="mini" role="status" hidden></p>
                </section>
                <section class="keyboard-card" id="keyboardCard" hidden>
                    <div id="keyboardScroller" class="keyboard-scroller"><div id="keyboard" class="keyboard"></div></div>
                </section>
            </div>
        </div>
        <section id="sessionSummary" class="settings-card" hidden><h2 data-i="results"></h2><div id="summaryBody"></div><details id="reviewDetails" hidden><summary data-i="review"></summary><ol id="reviewList"></ol></details></section>
        <details id="statistics" class="settings-card history-card">
            <summary data-i="statistics"></summary><div id="historyBody"></div>
            <div class="history-actions"><button id="exportButton" class="secondary" data-i="backup"></button><button id="importButton" class="secondary" data-i="restore"></button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
            <p class="mini" id="historyNotice" role="status"></p>
        <section class="tracker-strip" aria-label="Training time">
            <p id="trackerStatus">今日有效训练 0/60 分钟 · 仅本机，未同步</p>
            <details class="tracker-config">
                <summary><span id="trackerSettingTitle">训练时间同步设置</span> <span id="trackerSync"></span></summary>
                <label><span id="trackerEndpointLabel">Cloudflare 同步 Worker HTTPS 地址</span>
                    <input id="trackerEndpoint" type="url" placeholder="https://your-sync-worker.workers.dev" autocomplete="off">
                </label>
                <label><span id="trackerKeyLabel">个人配对码（不同网站和设备须完全相同）</span>
                    <input id="trackerKey" type="text" maxlength="32" autocomplete="off" spellcheck="false">
                </label>
                <div class="tracker-buttons">
                    <button type="button" id="trackerSave" class="secondary">保存同步设置</button>
                    <button type="button" id="trackerCopy" class="secondary">复制配对码</button>
                </div>
                <div id="trackerHistory" class="tracker-history"></div>
                <p id="trackerConfigMessage">未配置云端前，两个网站与设备的进度不能合并。</p>
            </details>
        </section>

        </details>
    </main>
    <script src="./vendor/WebAudioFontPlayer.js"></script>
    <script src="./i18n.js"></script>
    <script src="./training-core.js"></script>
    <script src="./answer-timer.js"></script>
    <script src="./ap-science.js"></script>
    <script src="./training-tracker.js"></script>
    <script src="./ap-focus-model.js"></script>
    <script src="./relative-course.js"></script>
    <script src="./unified-model.js"></script>
    <script src="./unified-copy.js"></script>
    <script src="./app.js"></script>
</body>
</html>
